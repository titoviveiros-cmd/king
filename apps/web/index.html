<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#140a24" />
    <meta name="color-scheme" content="dark" />
    <!-- iOS: quando salvo na tela de início, roda sem barra do Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KING" />
    <!-- O NOME CURTO do app (o "Adicionar à tela inicial" do Android lê este, não o <title> longo) -->
    <meta name="application-name" content="KING" />
    <title>KING — Jogue cartas com amigos</title>
    <meta name="description" content="Jogo de cartas online para 4 jogadores. Crie uma sala, chame os amigos e jogue no navegador." />
    <link rel="canonical" href="https://playkingcards.com.br/" />
    <!-- A PRÉVIA DO LINK (WhatsApp, Facebook, Telegram, X). Fica aqui, no HTML fixo, porque os robôs
         de prévia leem o HTML cru e não rodam JavaScript. Endereços ABSOLUTOS do domínio público: o
         cartão é montado fora do site. A imagem sai de scripts/gerar-imagem-social.mjs; arte nova =
         arquivo novo (v3), para furar o cache dos apps. Travado em src/ui/previaDoLink.test.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="KING — Jogue cartas com amigos" />
    <meta property="og:description" content="Jogo de cartas online para 4 jogadores. Crie uma sala, chame os amigos e jogue no navegador." />
    <meta property="og:url" content="https://playkingcards.com.br/" />
    <meta property="og:image" content="https://playkingcards.com.br/king-social-v2-1200x630.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O rei do KING, sorridente, segurando o K de copas entre cartas de baralho, com o convite: Jogue com seus amigos" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KING — Jogue cartas com amigos" />
    <meta name="twitter:description" content="Jogo de cartas online para 4 jogadores. Crie uma sala, chame os amigos e jogue no navegador." />
    <meta name="twitter:image" content="https://playkingcards.com.br/king-social-v2-1200x630.jpg" />
    <meta name="twitter:image:alt" content="O rei do KING, sorridente, segurando o K de copas entre cartas de baralho, com o convite: Jogue com seus amigos" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
